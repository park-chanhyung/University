<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>찬형대학교 수강신청</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="container">
    <div th:if="${fixedNotice}" class="notice-section">
        <div class="notice-title" th:text="${fixedNotice.title}">공지사항 제목</div>
        <div class="notice-content" th:text="${fixedNotice.content}">

        </div>

    </div>
    <div class="login-section">
        <div class="logo">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
        </div>

        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}">
                <div class="alert alert-danger">
                    사용자ID 또는 비밀번호를 확인해 주세요.
                </div>
            </div>
        <div class="input-group">
                <label for="username">학번 (Student ID)</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호 (Password)</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">로그인</button>
        </form>


        <div class="language-switch">
            <a href="/adminCheck">ENGLISH VERSION ›</a>
        </div>
    </div>
</div>
</body>
</html>
